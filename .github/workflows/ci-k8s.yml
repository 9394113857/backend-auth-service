# =====================================================
# 🚀 CI - K8S AUTH SERVICE (FINAL WORKING) ----
# =====================================================

name: 🚀 CI - K8S Auth Service   # Workflow name

# -----------------------------------------------------
# 🔁 Trigger: Runs on push to this branch
# -----------------------------------------------------
on:
  push:
    branches:
      - feature/k8s-auth-deploy

# -----------------------------------------------------
# ⚙️ Job Definition
# -----------------------------------------------------
jobs:
  build:
    runs-on: ubuntu-latest   # GitHub runner (Linux machine)

    steps:

      # -----------------------------------
      # 📥 STEP 1: Checkout repository code
      # -----------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------
      # 🏷️ STEP 2: Set version + metadata
      # -----------------------------------
      - name: Set Version Variables
        run: |
          VERSION=${GITHUB_SHA}
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "APP_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      # -----------------------------------
      # 🔐 STEP 3: Authenticate to GCP
      # -----------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # -----------------------------------
      # ☁️ STEP 4: Setup gcloud CLI
      # -----------------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # -----------------------------------
      # 🐳 STEP 5: Configure Docker for Artifact Registry
      # -----------------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      # -----------------------------------
      # 🏗️ STEP 6: Build Docker Image
      # -----------------------------------
      - name: Build Docker Image
        run: |
          docker build --no-cache \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg APP_COMMIT=${APP_COMMIT} \
            --build-arg APP_BRANCH=${APP_BRANCH} \
            -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service:${APP_VERSION} .

      # -----------------------------------
      # 📦 STEP 7: Push Image to GCP
      # -----------------------------------
      - name: Push Docker Image
        run: |
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service:${APP_VERSION}
