# =====================================================
# 🚀 CD - Railway Deploy (FORCE NEW IMAGE)
# =====================================================

name: 🚀 CD - Railway Force Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 🟢 Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v3

      # =========================
      # 🟢 Get Latest Commit Tag
      # =========================
      - name: Set Version
        run: |
          VERSION=dev-${GITHUB_SHA}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          echo "URL=https://backend-auth-service-production-7671.up.railway.app" >> $GITHUB_ENV

      # =========================
      # 🚀 FORCE DEPLOY NEW IMAGE
      # =========================
      - name: Force Deploy Railway
        run: |
          echo "🚀 Deploying image: $VERSION"

          curl -X POST https://backboard.railway.app/graphql/v2 \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"query\": \"mutation deploymentCreate($input: DeploymentCreateInput!) { deploymentCreate(input: $input) { id status } }\",
            \"variables\": {
              \"input\": {
                \"serviceId\": \"${{ secrets.RAILWAY_SERVICE_ID }}\",
                \"environmentId\": \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\"
              }
            }
          }"

      # =========================
      # ⏳ Wait
      # =========================
      - name: Wait
        run: sleep 60

      # =========================
      # 🧪 Health Check
      # =========================
      - name: Health Check
        run: |
          RESPONSE=$(curl -s $URL)

          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"Auth service running"* ]]; then
            echo "SUCCESS"
          else
            echo "FAILED"
            exit 1
          fi

      # =========================
      # 📧 Email Success
      # =========================
      - name: Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 CD SUCCESS - FORCE DEPLOY"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 Deployment SUCCESS

            🌐 URL:
            ${{ env.URL }}

            🐳 Version:
            ${{ env.VERSION }}

      # =========================
      # ❌ Email Failure
      # =========================
      - name: Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 CD FAILED"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚨 Deployment FAILED
