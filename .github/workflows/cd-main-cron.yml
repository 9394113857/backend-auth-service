# =====================================================
# 🚀 CD - Railway Deploy (FINAL)
# =====================================================

name: 🚀 CD - Railway Deploy

on:
  workflow_dispatch:        # ✅ manual trigger
  schedule:
    - cron: "30 20 * * *"   # ✅ daily (2:00 AM IST)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 🟢 Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v3

      # =========================
      # 🟢 Set Variables
      # =========================
      - name: Set Variables
        run: |
          echo "URL=https://backend-auth-service-production-7671.up.railway.app" >> $GITHUB_ENV
          echo "IMAGE=pythoncodelife/backend-auth-service:latest" >> $GITHUB_ENV

      # =========================
      # 🚀 Trigger Railway Deploy
      # =========================
      - name: 🚀 Deploy to Railway
        run: |
          echo "🚀 Triggering Railway deploy..."

          curl -X POST https://backboard.railway.app/graphql/v2 \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "query": "mutation deploymentCreate($input: DeploymentCreateInput!) { deploymentCreate(input: $input) { id status } }",
            "variables": {
              "input": {
                "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}",
                "environmentId": "${{ secrets.RAILWAY_ENVIRONMENT_ID }}"
              }
            }
          }'

      # =========================
      # ⏳ Wait for deployment
      # =========================
      - name: Wait
        run: sleep 60

      # =========================
      # 🧪 Health Check
      # =========================
      - name: Health Check
        run: |
          RESPONSE=$(curl -s $URL)

          echo "Response:"
          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"Auth service running"* ]]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

      # =========================
      # 📧 Email Success
      # =========================
      - name: 📧 Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 CD SUCCESS - Railway Deploy"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 Railway Deployment SUCCESS

            🌐 URL:
            ${{ env.URL }}

            🐳 Image:
            ${{ env.IMAGE }}

            ✅ Latest image deployed successfully

      # =========================
      # ❌ Email Failure
      # =========================
      - name: ❌ Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 CD FAILED - Railway Deploy"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚨 Railway Deployment FAILED

            🌐 URL:
            ${{ env.URL }}

            🔧 Check GitHub Actions logs immediately
