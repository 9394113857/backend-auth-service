# =====================================================
# 🚀 CD - Render Deploy (FULL METADATA EMAIL)
# =====================================================

name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: 🟢 Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🟢 Extract Git Info
        run: |
          TAG=$(git describe --tags --abbrev=0 || echo "no-tag")

          COMMIT_FULL=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)

          if [ -z "$COMMIT_BODY" ]; then
            COMMIT_BODY="No details available"
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "COMMIT_FULL=$COMMIT_FULL" >> $GITHUB_ENV
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV
          echo "COMMIT_TITLE=$COMMIT_TITLE" >> $GITHUB_ENV
          echo "COMMIT_BODY<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 🚀 Trigger Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: ⏳ Wait
        run: sleep 30

      - name: 🧪 Health Check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://backend-auth-service-ks6f.onrender.com)
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: 📧 SUCCESS EMAIL
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 CD SUCCESS - ${{ env.TAG }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 Deployment Success

            🏷️ Tag: ${{ env.TAG }}

            🔹 Commit (7): ${{ env.COMMIT_SHORT }}
            🔹 Commit (Full): ${{ env.COMMIT_FULL }}

            📝 Title:
            ${{ env.COMMIT_TITLE }}

            📄 Details:
            ${{ env.COMMIT_BODY }}

      - name: ❌ FAILURE EMAIL
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 CD FAILED - ${{ env.TAG }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            ❌ Deployment Failed

            🏷️ Tag: ${{ env.TAG }}

            🔹 Commit (7): ${{ env.COMMIT_SHORT }}
            🔹 Commit (Full): ${{ env.COMMIT_FULL }}

            📝 Title:
            ${{ env.COMMIT_TITLE }}

            📄 Details:
            ${{ env.COMMIT_BODY }}
