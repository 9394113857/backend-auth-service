name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

  schedule:
    - cron: "30 21 * * *" # 03:00 AM IST daily

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 📦 CHECKOUT CODE
      # ==================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ==================================================
      # 🔧 SET METADATA (SAFE + FINAL VERSION LOGIC)
      # ==================================================
      - name: Set Metadata
        shell: bash
        run: |
          set -e

          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$LATEST_TAG"
          fi

          IMAGE="pythoncodelife/backend-auth-service:${VERSION}"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          echo "RENDER_URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV
          echo "DOCKERHUB_URL=https://hub.docker.com/r/pythoncodelife/backend-auth-service/tags" >> $GITHUB_ENV

          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV

      # ==================================================
      # 🚀 TRIGGER RENDER DEPLOY
      # ==================================================
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # ==================================================
      # ⏳ WAIT
      # ==================================================
      - name: Wait Startup
        run: sleep 20

      # ==================================================
      # ❤️ HEALTH CHECK
      # ==================================================
      - name: Health Check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.RENDER_URL }}")
            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "DEPLOY_OK=true" >> $GITHUB_ENV
              exit 0
            fi

            sleep 10
          done

          echo "DEPLOY_OK=false" >> $GITHUB_ENV
          exit 1

      # ==================================================
      # 🎉 SUCCESS EMAIL
      # ==================================================
      - name: Send Deployment Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 DEPLOY SUCCESS | Backend Auth Service ${{ env.VERSION }} 🎉"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions CD

          body: |
            🚀 DEPLOYMENT SUCCESS 🎉

            ==================================================

            🌐 LIVE SERVICE URL
            ${ { env.RENDER_URL } }

            🐳 DOCKER IMAGE
            ${ { env.IMAGE } }

            🐳 DOCKER HUB TAGS
            ${ { env.DOCKERHUB_URL } }

            ==================================================

            📦 VERSION: ${{ env.VERSION }}
            🔗 COMMIT: ${{ env.COMMIT }}
            🌿 BRANCH: ${{ env.BRANCH }}

            ==================================================

            ⏱ UTC TIME: ${{ env.DEPLOY_TIME_UTC }}
            🇮🇳 IST TIME: ${{ env.DEPLOY_TIME_IST }}

            ==================================================

            🟢 STATUS: LIVE & HEALTHY

            🎯 Backend Auth Service deployed successfully!

      # ==================================================
      # ❌ FAILURE EMAIL
      # ==================================================
      - name: Send Deployment Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "❌ DEPLOY FAILED | Backend Auth Service ${{ env.VERSION }} 💥"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions CD

          body: |
            ❌ DEPLOYMENT FAILED 💥

            Repo: ${{ github.repository }}
            Version: ${{ env.VERSION }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            🌐 Service: ${{ env.RENDER_URL }}
            🐳 Image: ${{ env.IMAGE }}

            ⏱ Time UTC: ${{ env.DEPLOY_TIME_UTC }}
            🇮🇳 Time IST: ${{ env.DEPLOY_TIME_IST }}

            🚨 Check Render + GitHub Actions logs immediately
