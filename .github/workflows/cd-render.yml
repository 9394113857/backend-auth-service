name: 🚀 CD - Render Release Deploy

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # 📦 CHECKOUT
      # ==================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ==================================================
      # 🔧 SET METADATA (TAG ONLY)
      # ==================================================
      - name: Set Metadata
        shell: bash
        run: |
          set -e

          VERSION=${GITHUB_REF#refs/tags/}
          IMAGE="pythoncodelife/backend-auth-service:${VERSION}"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

          echo "RENDER_URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV
          echo "DOCKERHUB_URL=https://hub.docker.com/r/pythoncodelife/backend-auth-service/tags" >> $GITHUB_ENV

      # ==================================================
      # 🐳 DOCKER LOGIN
      # ==================================================
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # ==================================================
      # 🐳 BUILD IMAGE
      # ==================================================
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE .

      # ==================================================
      # 📤 PUSH IMAGE
      # ==================================================
      - name: Push Docker Image
        run: |
          docker push $IMAGE

      # ==================================================
      # 🏷️ PUSH LATEST TAG
      # ==================================================
      - name: Push Latest Tag
        run: |
          docker tag $IMAGE pythoncodelife/backend-auth-service:latest
          docker push pythoncodelife/backend-auth-service:latest

      # ==================================================
      # 🧾 BUILD EMAIL BODY (IMPORTANT FIX)
      # ==================================================
      - name: Build Email Body
        run: |
          cat > email.txt << EOF
🚀 RELEASE DEPLOYED SUCCESS 🎉

==================================================

🌐 LIVE SERVICE URL
${RENDER_URL}

🐳 DOCKER IMAGE
${IMAGE}

🐳 DOCKER HUB TAGS
${DOCKERHUB_URL}

==================================================

📦 VERSION: ${VERSION}
🔗 COMMIT: ${GITHUB_SHA}

==================================================

🎯 STATUS: PRODUCTION DEPLOYED 🚀
EOF

          echo "EMAIL_BODY<<EOF" >> $GITHUB_ENV
          cat email.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # ==================================================
      # 📧 SEND EMAIL
      # ==================================================
      - name: Send Release Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 RELEASE DEPLOYED | Backend Auth Service ${{ env.VERSION }} 🎉"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions CD

          body: ${{ env.EMAIL_BODY }}
