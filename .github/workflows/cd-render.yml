name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # WAIT FOR IMAGE
      # ==========================================
      - name: Wait for Docker Image
        run: |
          echo "⏳ Waiting for image availability..."
          sleep 30

      # ==========================================
      # TRIGGER RENDER
      # ==========================================
      - name: Trigger Render Deployment
        run: |
          echo "🚀 Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # ==========================================
      # WAIT FOR STARTUP
      # ==========================================
      - name: Wait for Startup
        run: |
          sleep 50

      # ==========================================
      # HEALTH CHECK
      # ==========================================
      - name: Health Check
        run: |

          URL="https://backend-auth-service-ks6f.onrender.com"

          echo "🔍 Checking deployment health..."

          for i in {1..10}; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)

            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then

              echo "🟢 Service is healthy"

              exit 0
            fi

            sleep 10

          done

          echo "🔴 Deployment failed"
          exit 1

      # ==========================================
      # EMAIL SUCCESS
      # ==========================================
      - name: Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 Render CD SUCCESS - Backend Auth Service"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            🚀 Render Deployment SUCCESS

            🌐 URL:
            https://backend-auth-service-ks6f.onrender.com

            🟢 Service is healthy and responding.

            ✅ Latest Docker image deployed successfully.

      # ==========================================
      # EMAIL FAILURE
      # ==========================================
      - name: Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "❌ Render CD FAILURE - Backend Auth Service"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            ❌ Render Deployment FAILED

            Service:
            backend-auth-service

            Please check:
            - GitHub Actions logs
            - Render logs
            - Health check endpoint
