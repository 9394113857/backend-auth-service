# =========================================================
# 🚀 CD PIPELINE - RENDER DEPLOYMENT
# =========================================================

name: 🚀 CD - Render Deploy

on:

  workflow_dispatch:

  push:

    tags:
      - "v*"


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 📦 CHECKOUT
      # ===================================================
      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          fetch-tags: true


      # ===================================================
      # 🔧 METADATA
      # ===================================================
      - name: Set Metadata

        run: |

          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "BRANCH=main" >> $GITHUB_ENV

          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV


      # ===================================================
      # 🚀 DEPLOY
      # ===================================================
      - name: Trigger Render Deployment

        run: |

          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


      # ===================================================
      # ⏳ WAIT
      # ===================================================
      - name: Wait Startup

        run: sleep 60


      # ===================================================
      # ❤️ HEALTH CHECK
      # ===================================================
      - name: Health Check

        id: healthcheck

        run: |

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          https://backend-auth-service-ks6f.onrender.com)

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" != "200" ]; then

            exit 1

          fi


      # ===================================================
      # 📧 DEPLOY SUCCESS EMAIL
      # ===================================================
      - name: Send Deployment Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            🚀 DEPLOYMENT SUCCESS | ${{ env.VERSION }}

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions Deployment

          body: |

            🚀 RENDER DEPLOYMENT SUCCESS

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            UTC:
            ${{ env.DEPLOY_TIME_UTC }}

            IST:
            ${{ env.DEPLOY_TIME_IST }}

            Live URL:
            https://backend-auth-service-ks6f.onrender.com


      # ===================================================
      # 🔁 ROLLBACK
      # ===================================================
      - name: Rollback Deployment

        if: failure()

        run: |

          echo "⚠️ Latest deployment failed"

          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n '2p')

          echo "Rolling back to ${PREVIOUS_TAG}"


      # ===================================================
      # 📧 ROLLBACK EMAIL
      # ===================================================
      - name: Send Rollback Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            ⚠️ DEPLOYMENT FAILED | Rollback Triggered

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions Deployment

          body: |

            ❌ Latest deployment failed.

            Rollback mechanism activated.

            Failed Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Previous stable tag detected automatically.

            Check Render logs immediately.