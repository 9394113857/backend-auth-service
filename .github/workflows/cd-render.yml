# =====================================================
# 🚀 CD - Render Deploy (FINAL FOR YOUR SERVICE)
# =====================================================

name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:        # ✅ manual trigger
  schedule:
    - cron: "30 20 * * *"   # ✅ daily (2:00 AM IST)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 🟢 Checkout Repo
      # =========================
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # =========================
      # 🟢 Fetch Tags (for info)
      # =========================
      - name: Fetch Tags
        run: git fetch --tags

      # =========================
      # 🟢 Detect Latest Tag (optional tracking)
      # =========================
      - name: Detect Version
        run: |
          TAGS=($(git tag --sort=-v:refname))
          
          if [ ${#TAGS[@]} -eq 0 ]; then
            VERSION="latest"
          else
            VERSION=${TAGS[0]}
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV

          echo "🚀 Deploying Version: $VERSION"

      # =========================
      # 🚀 Trigger Render Deploy
      # =========================
      - name: 🚀 Deploy to Render
        run: |
          echo "Calling Render Deploy Hook..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # =========================
      # ⏳ Wait for deployment
      # =========================
      - name: Wait
        run: sleep 70

      # =========================
      # 🧪 Health Check
      # =========================
      - name: Health Check
        run: |
          RESPONSE=$(curl -s $URL)

          echo "Response:"
          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"Auth service running"* ]]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

      # =========================
      # 📧 Email Success
      # =========================
      - name: 📧 Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 Render CD SUCCESS - ${{ env.VERSION }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 Render Deployment SUCCESS

            🏷️ Version: ${{ env.VERSION }}

            🌐 URL:
            ${{ env.URL }}

            ✅ Latest Docker image deployed successfully 🚀

      # =========================
      # ❌ Email Failure
      # =========================
      - name: ❌ Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 Render CD FAILED"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚨 Render Deployment FAILED

            🏷️ Attempted Version: ${{ env.VERSION }}

            🌐 URL:
            ${{ env.URL }}

            🔧 Check GitHub Actions logs immediately
