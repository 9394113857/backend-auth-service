name: 🚀 CD - Render Release Deploy

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ==========================
      # 🔧 METADATA
      # ==========================
      - name: Set Metadata
        shell: bash
        run: |
          set -e

          VERSION=${GITHUB_REF#refs/tags/}
          IMAGE="pythoncodelife/backend-auth-service:${VERSION}"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

          echo "RENDER_URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV
          echo "DOCKERHUB_URL=https://hub.docker.com/r/pythoncodelife/backend-auth-service/tags" >> $GITHUB_ENV

      # ==========================
      # 🐳 DOCKER LOGIN
      # ==========================
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # ==========================
      # 🐳 BUILD
      # ==========================
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE .

      # ==========================
      # 📤 PUSH
      # ==========================
      - name: Push Docker Image
        run: |
          docker push $IMAGE

      # ==========================
      # 🏷️ PUSH LATEST
      # ==========================
      - name: Push Latest Tag
        run: |
          docker tag $IMAGE pythoncodelife/backend-auth-service:latest
          docker push pythoncodelife/backend-auth-service:latest

      # ==========================
      # 📧 SIMPLE EMAIL (SAFE - NO YAML BREAK)
      # ==========================
      - name: Send Release Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 RELEASE DEPLOYED | ${{ env.VERSION }} 🎉"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions CD

          body: |
            🚀 RELEASE SUCCESS 🎉

            =======================================

            🌐 LIVE SERVICE
            ${{ env.RENDER_URL }}

            🐳 DOCKER IMAGE
            ${{ env.IMAGE }}

            🐳 DOCKER HUB
            ${{ env.DOCKERHUB_URL }}

            =======================================

            📦 VERSION: ${{ env.VERSION }}
            🔗 COMMIT: ${{ github.sha }}

            🎯 STATUS: DEPLOYED SUCCESSFULLY 🚀
