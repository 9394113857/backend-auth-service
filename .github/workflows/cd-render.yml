name: 🚀 CD - Backend Auth Service Render


on:


  # ===================================================
  # 🖐️ MANUAL DEPLOYMENT
  # ===================================================

  workflow_dispatch:



  # ===================================================
  # ⏰ DAILY 2 AM IST
  # 20:30 UTC
  # ===================================================

  schedule:

    - cron: "30 20 * * *"





jobs:


  # ===================================================
  # 🚀 DEPLOYMENT
  # ===================================================

  deploy:


    name: 🚀 Deploy Backend Auth Service


    runs-on: ubuntu-latest



    steps:



      # ===================================================
      # 📦 CHECKOUT
      # ===================================================

      - name: Checkout Code


        uses: actions/checkout@v4


        with:

          fetch-depth: 0

          fetch-tags: true





      # ===================================================
      # 🔧 METADATA
      # ===================================================

      - name: Set Deployment Metadata


        run: |


          if [[ "${GITHUB_REF}" == refs/tags/* ]]

          then

            VERSION=${GITHUB_REF#refs/tags/}

          else

            VERSION="manual"

          fi



          echo "VERSION=${VERSION}" >> $GITHUB_ENV


          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV


          echo "BRANCH=main" >> $GITHUB_ENV



          echo "SERVICE_URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV


          echo "HEALTH_URL=https://backend-auth-service-ks6f.onrender.com/" >> $GITHUB_ENV



          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV


          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV






      # ===================================================
      # 🚀 TRIGGER RENDER
      # ===================================================

      - name: Trigger Render Deployment


        run: |


          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"




      # ===================================================
      # ⏳ WAIT
      # ===================================================

      - name: Wait For Deployment


        run: |


          echo "Waiting for Render..."

          sleep 70





      # ===================================================
      # ❤️ HEALTH CHECK
      # ===================================================

      - name: Health Check


        run: |


          echo "Checking health..."


          for i in {1..10}

          do


            STATUS=$(curl -s \
            -o /dev/null \
            -w "%{http_code}" \
            "${{ env.HEALTH_URL }}")



            echo "Attempt $i -> HTTP $STATUS"



            if [ "$STATUS" = "200" ]

            then


              echo "DEPLOY_STATUS=SUCCESS" >> $GITHUB_ENV


              exit 0


            fi



            sleep 10



          done



          echo "DEPLOY_STATUS=FAILED" >> $GITHUB_ENV


          exit 1





      # ===================================================
      # 📧 SUCCESS EMAIL
      # ===================================================

      - name: Send Deployment Success Email


        if: success()


        uses: dawidd6/action-send-mail@v3



        with:


          server_address: smtp.gmail.com

          server_port: 465

          secure: true



          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}



          subject: "🚀 DEPLOY SUCCESS | Backend Auth Service ${{ env.VERSION }}"



          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}



          from: GitHub Actions CD



          body: |


            🚀 DEPLOYMENT SUCCESS


            =====================================


            🌐 SERVICE

            Backend Auth Service



            🔗 APPLICATION URL

            ${{ env.SERVICE_URL }}



            ❤️ HEALTH URL

            ${{ env.HEALTH_URL }}



            =====================================


            🏷️ VERSION

            ${{ env.VERSION }}



            🔖 COMMIT

            ${{ env.COMMIT }}



            🌿 BRANCH

            ${{ env.BRANCH }}



            ⚡ TRIGGER

            ${{ github.event_name }}



            👤 TRIGGERED BY

            ${{ github.actor }}



            =====================================


            ⏰ DEPLOY TIME UTC

            ${{ env.DEPLOY_TIME_UTC }}



            ⏰ DEPLOY TIME IST

            ${{ env.DEPLOY_TIME_IST }}



            ❤️ HEALTH STATUS

            ${{ env.DEPLOY_STATUS }}







      # ===================================================
      # 📧 FAILURE EMAIL
      # ===================================================

      - name: Send Deployment Failure Email


        if: failure()


        uses: dawidd6/action-send-mail@v3



        with:


          server_address: smtp.gmail.com

          server_port: 465

          secure: true



          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}



          subject: "❌ DEPLOY FAILED | Backend Auth Service"



          to: ${{ secrets.MAIL_TO }}

          cc: ${{ secrets.MAIL_CC }}



          from: GitHub Actions CD



          body: |


            ❌ DEPLOYMENT FAILED


            =====================================


            Repository:

            ${{ github.repository }}



            Version:

            ${{ env.VERSION }}



            Commit:

            ${{ env.COMMIT }}



            Branch:

            ${{ env.BRANCH }}



            Trigger:

            ${{ github.event_name }}



            Health URL:

            ${{ env.HEALTH_URL }}



            Status:

            ❌ FAILED



            Check:

            - GitHub Actions logs
            - Render logs
            - Application health endpoint
