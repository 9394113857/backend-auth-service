# =====================================================
# 🚀 CD - Backend Auth Service Render
# =====================================================

name: 🚀 CD - Backend Auth Service Render

run-name: 🚀 Deploy ${{ github.event_name }} | ${{ github.event.workflow_run.head_branch || github.ref_name }} | ${{ github.actor }}

on:

  # =====================================================
  # 🖐️ MANUAL DEPLOYMENT
  # =====================================================

  workflow_dispatch:

  # =====================================================
  # 🚀 AUTOMATIC DEPLOYMENT
  # Runs ONLY after the CI workflow (including Docker release)
  # completes successfully for a version tag.
  # =====================================================

  workflow_run:
    workflows:
      - "🚀 CI - Backend Auth Service Render"
    types:
      - completed

jobs:

  # =====================================================
  # 🚀 DEPLOYMENT JOB
  # =====================================================

  deploy:
    name: 🚀 Deploy Backend Auth Service

    # For automatic runs, require a successful tag-push CI run.
    # The CI workflow's docker-release job is part of that run and
    # must succeed for the overall run conclusion to be success.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 📦 CHECKOUT THE RELEASED COMMIT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      # =====================================================
      # 🏷️ VERSION METADATA
      # =====================================================

      - name: Detect Deployment Metadata
        env:
          DEPLOYMENT_TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |

          if [ "$DEPLOYMENT_TRIGGER" = "workflow_run" ]; then
            VERSION="$RELEASE_TAG"
            COMMIT="$RELEASE_SHA"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
            COMMIT="$GITHUB_SHA"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "BRANCH=main" >> "$GITHUB_ENV"

          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> "$GITHUB_ENV"
          echo "SERVICE_URL=https://backend-auth-service-ks6f.onrender.com" >> "$GITHUB_ENV"

          echo "======================================"
          echo "🚀 Backend Auth Service Deployment"
          echo "======================================"
          echo "Version: $VERSION"
          echo "Commit:  $COMMIT"
          echo "Branch:  main"

      # =====================================================
      # 🚀 TRIGGER RENDER DEPLOYMENT
      # =====================================================

      - name: Trigger Render Deploy
        run: |

          echo "🚀 Triggering Render Deployment..."
          curl --fail --show-error --silent -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # =====================================================
      # ⏳ WAIT FOR APPLICATION STARTUP
      # =====================================================

      - name: Wait For Startup
        run: |

          echo "Waiting for application startup..."
          sleep 30

      # =====================================================
      # ❤️ HEALTH CHECK
      # =====================================================

      - name: Health Check
        run: |

          echo "🔍 Checking Backend Auth Service Health..."

          for i in {1..10}
          do
            STATUS=$(curl -s \
              -o /dev/null \
              -w "%{http_code}" \
              "${{ secrets.APPLICATION_HEALTH_URL }}")

            REMAINING=$((10 - i))
            echo "❤️ Health Check Attempt $i/10 → HTTP $STATUS | ⏳ Remaining: $REMAINING"

            if [ "$STATUS" = "200" ]; then
              echo "🟢 Backend Auth Service Healthy"
              echo "DEPLOY_STATUS=SUCCESS" >> "$GITHUB_ENV"
              exit 0
            fi

            sleep 10
          done

          echo "DEPLOY_STATUS=FAILED" >> "$GITHUB_ENV"
          echo "🔴 Backend Auth Service health check failed"
          exit 1

      # =====================================================
      # 📧 DEPLOYMENT SUCCESS EMAIL
      # =====================================================

      - name: 📧 Deployment Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CD SUCCESS | Backend Auth Service ${{ env.VERSION }}"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: Backend Auth Service <${{ secrets.MAIL_USERNAME }}>

          body: |
            🚀 DEPLOYMENT SUCCESS

            Service:
            Backend Auth Service

            URL:
            ${{ env.SERVICE_URL }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Trigger:
            ${{ github.event_name }}

            Triggered By:
            ${{ github.actor }}

            Deploy Time UTC:
            ${{ env.DEPLOY_TIME_UTC }}

            Deploy Time IST:
            ${{ env.DEPLOY_TIME_IST }}

            Health:
            ${{ env.DEPLOY_STATUS }}

      # =====================================================
      # ❌ DEPLOYMENT FAILURE EMAIL
      # =====================================================

      - name: ❌ Deployment Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚨 CD FAILED | Backend Auth Service"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: Backend Auth Service <${{ secrets.MAIL_USERNAME }}>

          body: |
            🚨 DEPLOYMENT FAILED

            Service:
            Backend Auth Service

            URL:
            ${{ env.SERVICE_URL }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Trigger:
            ${{ github.event_name }}

            Triggered By:
            ${{ github.actor }}

            Please check:

            ❌ GitHub Actions logs
            ❌ Render deployment logs
            ❌ Application health endpoint
