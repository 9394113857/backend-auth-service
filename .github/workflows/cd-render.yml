name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 🟢 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🚀 Trigger Render Deploy
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # ⏳ Wait for startup
      - name: Wait
        run: sleep 40

      # 🧪 Health Check
      - name: Health Check
        run: |
          URL="https://backend-auth-service-ks6f.onrender.com"
          echo "🔍 Checking service..."

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)
            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "🟢 Service is UP"
              exit 0
            fi

            sleep 10
          done

          echo "🔴 Deployment failed"
          exit 1

      # 📧 SUCCESS EMAIL
      - name: Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 Render Deployment SUCCESS"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 Deployment SUCCESS
            🌐 https://backend-auth-service-ks6f.onrender.com
            🟢 Service is healthy

      # ❌ FAILURE EMAIL
      - name: Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 Render Deployment FAILED"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚨 Deployment FAILED
            🌐 https://backend-auth-service-ks6f.onrender.com
            ❌ Health check failed
