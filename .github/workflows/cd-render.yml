name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

  schedule:
    - cron: "30 21 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ==========================
      # 🔧 METADATA (SAFE VERSION)
      # ==========================
      - name: Set Metadata
        shell: bash
        run: |
          set -e

          # Default fallback version
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$LATEST_TAG"
          fi

          IMAGE="pythoncodelife/backend-auth-service:${VERSION}"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV

          echo "RENDER_URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV
          echo "DOCKERHUB_URL=https://hub.docker.com/r/pythoncodelife/backend-auth-service/tags" >> $GITHUB_ENV

      - name: Trigger Render Deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait Startup
        run: sleep 70

      - name: Health Check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.RENDER_URL }}")
            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "DEPLOY_OK=true" >> $GITHUB_ENV
              exit 0
            fi

            sleep 10
          done

          echo "DEPLOY_OK=false" >> $GITHUB_ENV
          exit 1

      - name: Send Deployment Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 DEPLOY SUCCESS | Backend Auth Service ${{ env.VERSION }}"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: GitHub Actions CD
          body: |
            🚀 DEPLOY SUCCESS

            VERSION: ${{ env.VERSION }}
            COMMIT: ${{ env.COMMIT }}
            BRANCH: ${{ env.BRANCH }}
            IMAGE: ${{ env.IMAGE }}

            TIME UTC: ${{ env.DEPLOY_TIME_UTC }}
            TIME IST: ${{ env.DEPLOY_TIME_IST }}

            STATUS: ${{ env.DEPLOY_OK }}

      - name: Send Deployment Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ DEPLOY FAILED | Backend Auth Service ${{ env.VERSION }}"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: GitHub Actions CD
          body: |
            ❌ DEPLOY FAILED

            Repo: ${{ github.repository }}
            VERSION: ${{ env.VERSION }}
            COMMIT: ${{ github.sha }}
            BRANCH: ${{ github.ref_name }}
