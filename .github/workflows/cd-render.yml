name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # 🔥 WAIT FOR DOCKER IMAGE TO BE READY
      - name: Wait for Image Push
        run: |
          echo "⏳ Waiting for image to be available..."
          sleep 30

      # 🚀 Trigger Render Deploy
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # ⏳ Wait for startup
      - name: Wait
        run: sleep 50

      # 🧪 Health Check
      - name: Health Check
        run: |
          URL="https://backend-auth-service-ks6f.onrender.com"
          echo "🔍 Checking service..."

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)
            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "🟢 Service is UP"
              exit 0
            fi

            sleep 10
          done

          echo "🔴 Deployment failed"
          exit 1
