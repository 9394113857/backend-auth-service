# =====================================================
# 🚀 CD - Render Deploy (FINAL STABLE VERSION)
# =====================================================

name: 🚀 CD - Render Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 🟢 Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # =========================
      # 🟢 Fetch Tags
      # =========================
      - name: Fetch Tags
        run: git fetch --tags

      # =========================
      # 🟢 Extract Git Info
      # =========================
      - name: Extract Git Info
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag")

          COMMIT_FULL=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)

          if [ -z "$COMMIT_BODY" ]; then
            COMMIT_BODY="No details available"
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "COMMIT_FULL=$COMMIT_FULL" >> $GITHUB_ENV
          echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV
          echo "COMMIT_TITLE=$COMMIT_TITLE" >> $GITHUB_ENV

          echo "COMMIT_BODY<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "URL=https://backend-auth-service-ks6f.onrender.com" >> $GITHUB_ENV

      # =========================
      # 🚀 Trigger Render Deploy
      # =========================
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering Render Deploy..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      # =========================
      # ⏳ Initial Wait
      # =========================
      - name: Initial Wait
        run: |
          echo "⏳ Waiting for service to start..."
          sleep 30

      # =========================
      # 🧪 HEALTH CHECK (FINAL FIX)
      # =========================
      - name: Health Check
        run: |
          echo "🔍 Starting health check..."

          for i in {1..25}; do
            echo "Attempt $i..."

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL || echo "000")

            echo "HTTP STATUS: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "🟢 Service is UP"
              exit 0
            fi

            echo "⏳ Waiting 10 seconds..."
            sleep 10
          done

          echo "🔴 Service failed after retries"
          exit 1

      # =========================
      # 📧 SUCCESS EMAIL
      # =========================
      - name: 📧 Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚀 CD SUCCESS - ${{ env.TAG }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚀 Deployment SUCCESS

            🏷️ Tag: ${{ env.TAG }}

            🔹 Commit (7): ${{ env.COMMIT_SHORT }}
            🔹 Commit (Full):
            ${{ env.COMMIT_FULL }}

            📝 Title:
            ${{ env.COMMIT_TITLE }}

            📄 Details:
            ${{ env.COMMIT_BODY }}

            🌐 URL:
            ${{ env.URL }}

            🟢 Service is healthy and running

      # =========================
      # ❌ FAILURE EMAIL
      # =========================
      - name: ❌ Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME_MAIN }}
          password: ${{ secrets.MAIL_PASSWORD_MAIN }}
          subject: "🚨 CD FAILED - ${{ env.TAG }}"
          to: ${{ secrets.MAIL_USERNAME_MAIN }}
          cc: ${{ secrets.MAIL_TO_CC_MAIN }}
          from: ${{ secrets.MAIL_USERNAME_MAIN }}
          body: |
            🚨 Deployment FAILED

            🏷️ Tag: ${{ env.TAG }}

            🔹 Commit (7): ${{ env.COMMIT_SHORT }}
            🔹 Commit (Full):
            ${{ env.COMMIT_FULL }}

            📝 Title:
            ${{ env.COMMIT_TITLE }}

            📄 Details:
            ${{ env.COMMIT_BODY }}

            🌐 URL:
            ${{ env.URL }}

            ❌ Health check failed after multiple retries
            🔧 Check GitHub Actions logs immediately