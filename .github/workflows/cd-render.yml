# =========================================================
# 🚀 CD PIPELINE - RENDER DEPLOYMENT
# =========================================================

name: 🚀 CD - Render Deploy

on:

  workflow_dispatch:

  push:

    tags:
      - "v*"


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 📦 CHECKOUT
      # ===================================================
      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          fetch-tags: true


      # ===================================================
      # 🔧 METADATA
      # ===================================================
      - name: Set Metadata

        run: |

          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "BRANCH=main" >> $GITHUB_ENV

          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV


      # ===================================================
      # 🚀 TRIGGER DEPLOY
      # ===================================================
      - name: Trigger Render Deployment

        run: |

          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


      # ===================================================
      # ⏳ WAIT STARTUP
      # ===================================================
      - name: Wait Startup

        run: |

          sleep 70


      # ===================================================
      # ❤️ HEALTH CHECK
      # ===================================================
      - name: Health Check

        run: |

          URL="https://backend-auth-service-ks6f.onrender.com"

          for i in {1..10}; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)

            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then

              echo "🟢 Deployment successful"

              exit 0

            fi

            sleep 10

          done

          echo "🔴 Deployment failed"

          exit 1


      # ===================================================
      # 📧 DEPLOY SUCCESS EMAIL
      # ===================================================
      - name: Send Deployment Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            🚀 DEPLOYMENT SUCCESS | ${{ env.VERSION }}

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions Deployment

          body: |

            🚀 RENDER DEPLOYMENT SUCCESS

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            UTC:
            ${{ env.DEPLOY_TIME_UTC }}

            IST:
            ${{ env.DEPLOY_TIME_IST }}

            Live URL:
            https://backend-auth-service-ks6f.onrender.com


      # ===================================================
      # ❌ FAILURE EMAIL
      # ===================================================
      - name: Send Deployment Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            ❌ DEPLOYMENT FAILED | ${{ env.VERSION }}

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions Deployment

          body: |

            ❌ Render deployment failed.

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            Check Render + GitHub Actions logs immediately.