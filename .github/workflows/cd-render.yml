# =========================================================
# 🚀 CD PIPELINE - RENDER DEPLOYMENT
# =========================================================

name: 🚀 CD - Render Deploy

on:

  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 📦 CHECKOUT
      # ===================================================
      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          fetch-tags: true


      # ===================================================
      # 🕒 DEPLOYMENT TIME
      # ===================================================
      - name: Set Deployment Metadata

        run: |

          echo "DEPLOY_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

          echo "DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV


      # ===================================================
      # ⏳ WAIT FOR DOCKER SYNC
      # ===================================================
      - name: Wait for Docker Image

        run: |

          echo "⏳ Waiting for Docker image sync..."

          sleep 30


      # ===================================================
      # 🚀 TRIGGER RENDER DEPLOY
      # ===================================================
      - name: Trigger Render Deployment

        run: |

          echo "🚀 Triggering Render deployment..."

          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


      # ===================================================
      # ⏳ WAIT FOR STARTUP
      # ===================================================
      - name: Wait for Startup

        run: |

          sleep 50


      # ===================================================
      # ❤️ HEALTH CHECK
      # ===================================================
      - name: Health Check

        run: |

          URL="https://backend-auth-service-ks6f.onrender.com"

          echo "🔍 Checking service health..."

          for i in {1..10}; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL)

            echo "Attempt $i → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then

              echo "🟢 Service is healthy"

              exit 0

            fi

            sleep 10

          done

          echo "🔴 Deployment failed"

          exit 1
