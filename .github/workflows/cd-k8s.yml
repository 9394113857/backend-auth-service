# =====================================================
# 🚀 CD - K8S AUTH SERVICE (FINAL FIXED)
# =====================================================

name: 🚀 CD - K8S Auth Service

on:
  # 🔘 Manual trigger (Run button in GitHub)
  workflow_dispatch:

  # ⏰ Daily run (2 AM IST)
  schedule:
    - cron: "30 20 * * *"

  # 🔁 Auto deploy on push
  push:
    branches:
      - feature/k8s-auth-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 📥 Checkout Code
      # -----------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------
      # 🔐 Authenticate to GCP
      # -----------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # -----------------------------------
      # ☁️ Setup gcloud
      # -----------------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # -----------------------------------
      # 🔗 Connect to GKE Cluster
      # -----------------------------------
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials my-cluster \
            --zone asia-south1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # -----------------------------------
      # 🚀 Deploy Latest SHA Image
      # -----------------------------------
      - name: Deploy to Kubernetes
        run: |
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service:${{ github.sha }}

          echo "🚀 Deploying image: $IMAGE"

          kubectl set image deployment/auth-deployment \
          auth-container=$IMAGE

          kubectl rollout status deployment/auth-deployment

          kubectl get pods -o wide
