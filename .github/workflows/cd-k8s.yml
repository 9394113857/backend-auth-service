# =====================================================
# 🚀 CD - K8S AUTH SERVICE (MANUAL + CRON ONLY)
# =====================================================

name: 🚀 CD - K8S Auth Service (Manual + Scheduled)

on:
  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"   # 2 AM IST

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials auth-cluster \
          --region ${{ secrets.GCP_REGION }} \
          --project ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy latest image
      run: |
        kubectl set image deployment/auth-deployment \
        auth-service-sha256-1=asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/auth-service:k8s-latest

        kubectl rollout status deployment/auth-deployment
