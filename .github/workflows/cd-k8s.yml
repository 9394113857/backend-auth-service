# =====================================================
# 🚀 CD - K8S AUTH SERVICE (FINAL)
# =====================================================

name: 🚀 CD - K8S Auth Service

on:
  # 🔘 Manual button
  workflow_dispatch:

  # ⏰ Daily 2 AM IST (20:30 UTC)
  schedule:
    - cron: "30 20 * * *"

  # 🔁 Auto deploy on push (feature branch)
  push:
    branches:
      - feature/k8s-auth-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 🟢 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 🛠 Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 🔧 Install GKE plugin
      - name: Install GKE Auth Plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      # 🔗 Connect to GKE
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials auth-cluster \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # 🚀 Deploy (SHA-based — FINAL FIX)
      - name: Deploy to Kubernetes
        run: |
          IMAGE=asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/auth-service:k8s-${{ github.sha }}

          echo "Deploying: $IMAGE"

          kubectl set image deployment/auth-deployment \
          auth-container=$IMAGE

          kubectl rollout status deployment/auth-deployment

          kubectl get pods -o wide
