# =====================================================
# 🚀 CD - K8S AUTH SERVICE (FINAL WORKING)
# =====================================================

name: 🚀 CD - K8S Auth Service

on:
  workflow_run:
    workflows: ["🚀 CI - K8S Auth Service"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # 📥 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # ☁️ Setup gcloud
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # 🔗 Connect to GKE
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials my-cluster \
            --zone asia-south1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # 🚀 Deploy SAME SHA
      - name: Deploy to Kubernetes
        run: |
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service:${{ github.event.workflow_run.head_sha }}

          echo "🚀 Deploying: $IMAGE"

          kubectl set image deployment/auth-deployment \
          auth-container=$IMAGE

          kubectl rollout status deployment/auth-deployment

          kubectl get pods -o wide
