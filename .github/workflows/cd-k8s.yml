# =====================================================
# 🚀 CD - K8S AUTH SERVICE (FINAL - BRANCH SYNCED)
# =====================================================

name: 🚀 CD - K8S Auth Service

on:
  # ✅ Manual trigger
  workflow_dispatch:

  # ✅ Auto deploy on feature branch (your dev flow)
  push:
    branches:
      - feature/k8s-auth-deploy
      - main

  # ✅ Nightly cron (optional)
  schedule:
    - cron: "30 20 * * *"   # 2 AM IST

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # ===============================
    # 🟢 Checkout SAME BRANCH
    # ===============================
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    # ===============================
    # 🔐 Authenticate to GCP
    # ===============================
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # ===============================
    # 🛠 Setup gcloud
    # ===============================
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # ===============================
    # 🔧 Install GKE Plugin
    # ===============================
    - name: Install GKE Auth Plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin --quiet

    # ===============================
    # 🔗 Connect to GKE
    # ===============================
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials auth-cluster \
          --region ${{ secrets.GCP_REGION }} \
          --project ${{ secrets.GCP_PROJECT_ID }}

    # ===============================
    # 🚀 Deploy Latest Image
    # ===============================
    - name: Deploy to Kubernetes
      run: |
        IMAGE=asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/auth-service:k8s-latest

        echo "🚀 Deploying IMAGE: $IMAGE"
        echo "🚀 Branch: ${{ github.ref }}"
        echo "🚀 Commit: ${{ github.sha }}"

        # Set image
        kubectl set image deployment/auth-deployment \
        auth-container=$IMAGE

        # Force restart (avoid cache issues)
        kubectl rollout restart deployment/auth-deployment

        # Wait for rollout
        kubectl rollout status deployment/auth-deployment

        # Show pods
        kubectl get pods -o wide
