# =====================================================
# 🚀 CD - K8S AUTH SERVICE (MANUAL + CRON)
# =====================================================

name: 🚀 CD - K8S Auth Service

on:
  workflow_dispatch:   # 🔘 Manual trigger
  schedule:
    - cron: "30 20 * * *"   # ⏰ 2 AM IST

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials my-cluster \
            --zone asia-south1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # 🔥 Get latest image automatically
      - name: Get latest image
        id: latest
        run: |
          TAG=$(gcloud artifacts docker images list \
          asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service \
          --include-tags \
          --sort-by=~UPDATE_TIME \
          --limit=1 \
          --format="value(TAGS)")

          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy
        run: |
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service:${{ steps.latest.outputs.TAG }}

          echo "Deploying: $IMAGE"

          kubectl set image deployment/auth-deployment \
          auth-container=$IMAGE

          kubectl rollout status deployment/auth-deployment
