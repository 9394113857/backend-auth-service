# =====================================================
# 🚀 CD - K8S AUTH SERVICE (MANUAL + CRON ONLY)
# =====================================================

name: 🚀 CD - K8S Auth Service (Manual + Scheduled)

on:
  # 🟢 Manual trigger from GitHub UI
  workflow_dispatch:

  # 🕒 Daily at 2 AM IST (20:30 UTC previous day)
  schedule:
    - cron: "30 20 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # ===============================
    # 🟢 Checkout Code
    # ===============================
    - name: Checkout
      uses: actions/checkout@v4

    # ===============================
    # 🔐 Authenticate to GCP
    # ===============================
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # ===============================
    # 🛠 Setup gcloud
    # ===============================
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # ===============================
    # 🔗 Connect to GKE Cluster
    # ===============================
    - name: Get GKE Credentials
      run: |
        gcloud container clusters get-credentials auth-cluster \
          --region ${{ secrets.GCP_REGION }} \
          --project ${{ secrets.GCP_PROJECT_ID }}

    # ===============================
    # 🚀 Deploy Latest Image
    # ===============================
    - name: Deploy Latest Image
      run: |
        kubectl set image deployment/auth-deployment \
        auth-service-sha256-1=asia-south2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/auth-service:k8s-latest

        kubectl rollout status deployment/auth-deployment