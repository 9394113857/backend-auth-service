# =====================================================
# 🚀 CD - K8S AUTH SERVICE (FINAL PRODUCTION)
# =====================================================

name: 🚀 CD - K8S Auth Service

on:
  # 🔥 Trigger ONLY after CI success (same SHA)
  workflow_run:
    workflows: ["🚀 CI - K8S Auth Service"]
    types:
      - completed

  # 🔘 Manual trigger (optional)
  workflow_dispatch:

jobs:
  deploy:
    # ✅ Only run if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 📥 Checkout
      # -----------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------
      # 🔐 Authenticate to GCP
      # -----------------------------------
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # -----------------------------------
      # ☁️ Setup gcloud
      # -----------------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # -----------------------------------
      # 🔧 FIX: Install GKE Auth Plugin (WORKING WAY)
      # -----------------------------------
      - name: Install GKE Auth Plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin

      # -----------------------------------
      # 🔗 Connect to GKE
      # -----------------------------------
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials my-cluster \
            --zone asia-south1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      # -----------------------------------
      # 🚀 Deploy (SAME SHA AS CI)
      # -----------------------------------
      - name: Deploy to Kubernetes
        run: |
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/auth-repo/auth-service:${{ github.event.workflow_run.head_sha }}

          echo "🚀 Deploying image: $IMAGE"

          kubectl set image deployment/auth-deployment \
          auth-container=$IMAGE

          kubectl rollout status deployment/auth-deployment

          kubectl get pods -o wide
