name: 🚀 CI - Backend Auth Service Render

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: CI Build - ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 📦 CHECKOUT CODE
      # ===================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ===================================================
      # 🐍 SETUP PYTHON
      # ===================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ===================================================
      # 📚 INSTALL DEPENDENCIES
      # ===================================================
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ===================================================
      # 🧪 RUN TESTS
      # ===================================================
      - name: Run Tests
        env:
          DATABASE_URL: sqlite:///test.db
          JWT_SECRET_KEY: testing-secret
          SECRET_KEY: testing-secret
          FLASK_ENV: testing
        run: |
          PYTHONPATH=. pytest -v

      # ===================================================
      # 🔧 SET METADATA (FIXED BRANCH LOGIC)
      # ===================================================
      - name: Set Metadata
        run: |
          # Commit SHA
          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          # Branch logic FIX:
          # If tag build → show "main"
          # Else → real branch name
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "BRANCH=main" >> $GITHUB_ENV
          else
            echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

          # Build timestamps
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV

          # Version + image logic
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "TYPE=TAG RELEASE" >> $GITHUB_ENV
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "IMAGE=pythoncodelife/backend-auth-service:${VERSION}" >> $GITHUB_ENV
          else
            echo "TYPE=BRANCH BUILD" >> $GITHUB_ENV
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "IMAGE=N/A" >> $GITHUB_ENV
          fi

      # ===================================================
      # 📄 BUILD INFO FILE
      # ===================================================
      - name: Generate Build Info
        run: |
          cat > build_info.json << EOF
          {
            "version": "${VERSION}",
            "commit": "${COMMIT}",
            "branch": "${BRANCH}",
            "build_time_utc": "${BUILD_TIME_UTC}",
            "build_time_ist": "${BUILD_TIME_IST}"
          }
          EOF

      # ===================================================
      # 🐳 DOCKER LOGIN (TAGS ONLY)
      # ===================================================
      - name: Docker Login
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      # ===================================================
      # 🐳 BUILD IMAGE (TAGS ONLY)
      # ===================================================
      - name: Build Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker build -t $IMAGE .

      # ===================================================
      # 📤 PUSH IMAGE (TAGS ONLY)
      # ===================================================
      - name: Push Docker Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push $IMAGE

      # ===================================================
      # 🏷️ PUSH LATEST IMAGE (TAGS ONLY)
      # ===================================================
      - name: Push Latest Image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag $IMAGE pythoncodelife/backend-auth-service:latest
          docker push pythoncodelife/backend-auth-service:latest

      # ===================================================
      # 📧 SUCCESS EMAIL
      # ===================================================
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ CI SUCCESS | Backend Auth Service"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: GitHub Actions CI/CD
          body: |
            CI SUCCESS

            Repository: ${{ github.repository }}
            Branch: ${{ env.BRANCH }}
            Tag/Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Event: ${{ github.event_name }}
            Triggered By: ${{ github.actor }}

            Type: ${{ env.TYPE }}
            Version: ${{ env.VERSION }}
            Image: ${{ env.IMAGE }}

            UTC Time: ${{ env.BUILD_TIME_UTC }}
            IST Time: ${{ env.BUILD_TIME_IST }}

      # ===================================================
      # ❌ FAILURE EMAIL
      # ===================================================
      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI FAILED | Backend Auth Service"
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          from: GitHub Actions CI/CD
          body: |
            CI FAILED

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Event: ${{ github.event_name }}
            Triggered By: ${{ github.actor }}

            Check GitHub Actions logs for details.