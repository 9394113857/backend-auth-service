# =========================================================
# 🚀 CI PIPELINE - BACKEND AUTH SERVICE
# =========================================================

name: 🚀 CI - Backend Auth Service

on:

  push:

    branches:
      - "**"

    tags:
      - "v*"

  pull_request:

  workflow_dispatch:


jobs:

  build:

    name: CI Build - ${{ github.ref_name }}

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 📦 CHECKOUT
      # ===================================================
      - name: Checkout Code

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          fetch-tags: true


      # ===================================================
      # 🐍 PYTHON
      # ===================================================
      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ===================================================
      # 📚 INSTALL
      # ===================================================
      - name: Install Dependencies

        run: |

          pip install --upgrade pip

          pip install -r requirements.txt

          pip install pytest


      # ===================================================
      # 🧪 TESTS
      # ===================================================
      - name: Run Tests

        env:

          DATABASE_URL: sqlite:///test.db

          JWT_SECRET_KEY: testing-secret

          SECRET_KEY: testing-secret

          FLASK_ENV: testing

        run: |

          PYTHONPATH=. pytest -v


      # ===================================================
      # 🔧 BUILD METADATA
      # ===================================================
      - name: Set Metadata

        run: |

          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

          echo "BUILD_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV


          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then

            VERSION=${GITHUB_REF#refs/tags/}

            echo "VERSION=${VERSION}" >> $GITHUB_ENV

            echo "PIPELINE_TYPE=TAG RELEASE" >> $GITHUB_ENV

          else

            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

            echo "VERSION=${LATEST_TAG}" >> $GITHUB_ENV

            echo "PIPELINE_TYPE=FEATURE/BRANCH BUILD" >> $GITHUB_ENV

          fi


      # ===================================================
      # 📄 BUILD INFO
      # ===================================================
      - name: Generate Build Info

        run: |

          echo "{
            \"version\": \"${VERSION}\",
            \"commit\": \"${COMMIT}\",
            \"branch\": \"${BRANCH}\",
            \"build_time_utc\": \"${BUILD_TIME_UTC}\",
            \"build_time_ist\": \"${BUILD_TIME_IST}\"
          }" > build_info.json

          cat build_info.json


      # ===================================================
      # 🐳 DOCKER LOGIN
      # ===================================================
      - name: Docker Login

        run: |

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin


      # ===================================================
      # 🐳 BUILD IMAGE
      # ===================================================
      - name: Build Docker Image

        run: |

          docker build \
          -t pythoncodelife/backend-auth-service:${VERSION} .


      # ===================================================
      # 📤 PUSH VERSION IMAGE
      # ===================================================
      - name: Push Version Image

        run: |

          docker push \
          pythoncodelife/backend-auth-service:${VERSION}


      # ===================================================
      # 🏷️ UPDATE LATEST
      # ===================================================
      - name: Push Latest Image

        run: |

          docker tag \
          pythoncodelife/backend-auth-service:${VERSION} \
          pythoncodelife/backend-auth-service:latest

          docker push \
          pythoncodelife/backend-auth-service:latest


      # ===================================================
      # 📧 SUCCESS EMAIL
      # ===================================================
      - name: Send CI Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            ✅ CI SUCCESS | ${{ env.VERSION }}

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions CI/CD

          body: |

            🚀 CI PIPELINE SUCCESS

            Pipeline Type:
            ${{ env.PIPELINE_TYPE }}

            Version:
            ${{ env.VERSION }}

            Commit:
            ${{ env.COMMIT }}

            Branch:
            ${{ env.BRANCH }}

            UTC:
            ${{ env.BUILD_TIME_UTC }}

            IST:
            ${{ env.BUILD_TIME_IST }}

            Docker Image:
            pythoncodelife/backend-auth-service:${{ env.VERSION }}


      # ===================================================
      # ❌ FAILURE EMAIL
      # ===================================================
      - name: Send CI Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:

          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: |
            ❌ CI FAILED | Backend Auth Service

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: GitHub Actions CI/CD

          body: |

            ❌ CI PIPELINE FAILED

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Check GitHub Actions logs immediately.