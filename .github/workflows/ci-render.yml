name: 🚀 CI - Backend Auth Service

on:
  push:
    branches:
      - "**"

    tags:
      - "v*"

  create:
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: CI Build - ${{ github.ref_name }}

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 📦 CHECKOUT
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================
      # 🐍 PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 📚 INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # =====================================================
      # 🧪 RUN TESTS
      # =====================================================
      - name: Run Tests
        env:
          DATABASE_URL: sqlite:///test.db
          JWT_SECRET_KEY: testing-secret
          SECRET_KEY: testing-secret
          FLASK_ENV: testing

        run: |
          PYTHONPATH=. pytest -v

      # =====================================================
      # 🔧 BUILD METADATA
      # =====================================================
      - name: Set Metadata
        run: |

          echo "REF=${GITHUB_REF}" >> $GITHUB_ENV
          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

          echo "BUILD_TIME_IST=$(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M:%S IST')" >> $GITHUB_ENV

          echo "REPO_URL=https://github.com/9394113857/backend-auth-service" >> $GITHUB_ENV

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then

            VERSION=${GITHUB_REF#refs/tags/}

            echo "TYPE=TAG" >> $GITHUB_ENV
            echo "NAME=${VERSION}" >> $GITHUB_ENV
            echo "BRANCH=release" >> $GITHUB_ENV

            echo "IMAGE=pythoncodelife/backend-auth-service:${VERSION}" >> $GITHUB_ENV

            echo "IS_TAG=true" >> $GITHUB_ENV

          else

            BRANCH=${GITHUB_REF#refs/heads/}

            echo "TYPE=BRANCH" >> $GITHUB_ENV
            echo "NAME=${BRANCH}" >> $GITHUB_ENV
            echo "BRANCH=${BRANCH}" >> $GITHUB_ENV

            echo "IMAGE=pythoncodelife/backend-auth-service:dev-${GITHUB_SHA}" >> $GITHUB_ENV

            echo "IS_TAG=false" >> $GITHUB_ENV

          fi

      # =====================================================
      # 📄 GENERATE BUILD INFO JSON
      # =====================================================
      - name: Generate Build Info
        run: |

          echo "{
            \"version\": \"${NAME}\",
            \"commit\": \"${COMMIT}\",
            \"branch\": \"${BRANCH}\",
            \"build_time_utc\": \"${BUILD_TIME_UTC}\",
            \"build_time_ist\": \"${BUILD_TIME_IST}\"
          }" > build_info.json

          cat build_info.json

      # =====================================================
      # 🐳 DOCKER LOGIN
      # =====================================================
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

      # =====================================================
      # 🐳 BUILD DOCKER IMAGE
      # =====================================================
      - name: Build Docker Image
        run: |

          docker build -t $IMAGE .

      # =====================================================
      # 📤 PUSH SHA / VERSION IMAGE
      # =====================================================
      - name: Push Docker Image
        run: |

          docker push $IMAGE

      # =====================================================
      # 🏷️ PUSH LATEST IMAGE (ONLY BRANCH)
      # =====================================================
      - name: Push Latest Image
        if: env.IS_TAG == 'false'

        run: |

          docker tag $IMAGE pythoncodelife/backend-auth-service:latest

          docker push pythoncodelife/backend-auth-service:latest

      # =====================================================
      # 📧 EMAIL SUCCESS
      # =====================================================
      - name: Email Success
        if: success()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CI SUCCESS on Auth Service - ${{ env.NAME }}"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            🚀 CI BUILD SUCCESS on Auth Service

            📌 Type:
            ${{ env.TYPE }}

            🏷️ Version/Branch:
            ${{ env.NAME }}

            🔑 Commit:
            ${{ env.COMMIT }}

            🌿 Branch:
            ${{ env.BRANCH }}

            🐳 Docker Image:
            ${{ env.IMAGE }}

            🕒 UTC:
            ${{ env.BUILD_TIME_UTC }}

            🇮🇳 IST:
            ${{ env.BUILD_TIME_IST }}

            🔗 Repo:
            ${{ env.REPO_URL }}

            ✅ Tests passed successfully
            ✅ build_info.json generated
            ✅ Docker image pushed successfully

      # =====================================================
      # ❌ EMAIL FAILURE
      # =====================================================
      - name: Email Failure
        if: failure()

        uses: dawidd6/action-send-mail@v3

        with:
          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "❌ CI FAILURE on Auth Service - ${{ github.ref_name }}"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            ❌ CI BUILD FAILED

            📌 Ref:
            ${{ github.ref }}

            🔑 Commit:
            ${{ github.sha }}

            🕒 UTC:
            ${{ env.BUILD_TIME_UTC }}

            🇮🇳 IST:
            ${{ env.BUILD_TIME_IST }}

            Please check:
            - GitHub Actions logs
            - Pytest failures
            - Docker build logs