name: 🚀 CI - Backend Auth Service

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: CI Build - ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # ==========================================
      # RUN TESTS
      # ==========================================
      - name: Run Tests
        run: PYTHONPATH=. pytest -v

      # ==========================================
      # SET BUILD VARIABLES
      # ==========================================
      - name: Set Metadata
        run: |

          echo "REF=${GITHUB_REF}" >> $GITHUB_ENV
          echo "COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then

            VERSION=${GITHUB_REF#refs/tags/}

            echo "TYPE=TAG" >> $GITHUB_ENV
            echo "NAME=${VERSION}" >> $GITHUB_ENV
            echo "BRANCH=release" >> $GITHUB_ENV

            echo "IMAGE=pythoncodelife/backend-auth-service:${VERSION}" >> $GITHUB_ENV

          else

            BRANCH=${GITHUB_REF#refs/heads/}

            echo "TYPE=BRANCH" >> $GITHUB_ENV
            echo "NAME=${BRANCH}" >> $GITHUB_ENV
            echo "BRANCH=${BRANCH}" >> $GITHUB_ENV

            echo "IMAGE=pythoncodelife/backend-auth-service:dev-${GITHUB_SHA}" >> $GITHUB_ENV

          fi

      # ==========================================
      # BUILD INFO
      # ==========================================
      - name: Generate Build Info
        run: |
          echo "{
            \"commit\": \"${COMMIT}\",
            \"branch\": \"${BRANCH}\",
            \"image\": \"${IMAGE}\",
            \"build_time_utc\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"
          }" > build_info.json

      # ==========================================
      # DOCKER LOGIN
      # ==========================================
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

      # ==========================================
      # BUILD IMAGE
      # ==========================================
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE .

      # ==========================================
      # PUSH IMAGE
      # ==========================================
      - name: Push Docker Image
        run: |
          docker push $IMAGE

      # ==========================================
      # PUSH LATEST FOR BRANCH BUILDS
      # ==========================================
      - name: Push Latest
        if: env.TYPE == 'BRANCH'
        run: |
          docker tag $IMAGE pythoncodelife/backend-auth-service:latest
          docker push pythoncodelife/backend-auth-service:latest

      # ==========================================
      # EMAIL SUCCESS
      # ==========================================
      - name: Email Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "🚀 CI SUCCESS on Auth Service - ${{ env.NAME }}"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            🚀 CI BUILD SUCCESS on Auth Service

            📌 Type: ${{ env.TYPE }}
            🏷️ Name: ${{ env.NAME }}

            🔑 Commit:
            ${{ env.COMMIT }}

            🌿 Branch:
            ${{ env.BRANCH }}

            🐳 Docker Image:
            ${{ env.IMAGE }}

            🔗 Repo:
            https://github.com/9394113857/backend-auth-service

            ✅ Docker image pushed successfully.

      # ==========================================
      # EMAIL FAILURE
      # ==========================================
      - name: Email Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "❌ CI FAILURE on Auth Service - ${{ github.ref_name }}"

          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |

            ❌ CI BUILD FAILED

            Repository:
            backend-auth-service

            Ref:
            ${{ github.ref }}

            Commit:
            ${{ github.sha }}

            Please check GitHub Actions logs.
