# =====================================================
# 🚀 CI - Backend Auth Service (TAG + COMMIT METADATA)
# =====================================================

name: 🚀 CI - Backend Auth Service

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: 🟢 Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🟢 Extract Git Info
        run: |
          TAG=$(git describe --tags --abbrev=0 || echo "no-tag")

          COMMIT_FULL=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)

          COMMIT_TITLE=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)

          COMMIT_TIME=$(git log -1 --pretty=%ci)

          if [ -z "$COMMIT_BODY" ]; then
            COMMIT_BODY="No details available"
          fi

          echo "APP_VERSION=$TAG" >> $GITHUB_ENV
          echo "APP_TAG=$TAG" >> $GITHUB_ENV
          echo "APP_COMMIT=$COMMIT_FULL" >> $GITHUB_ENV
          echo "APP_COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_ENV
          echo "APP_COMMIT_TITLE=$COMMIT_TITLE" >> $GITHUB_ENV
          echo "APP_COMMIT_BODY<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "APP_COMMIT_TIME=$COMMIT_TIME" >> $GITHUB_ENV

      - name: 🟢 Generate build_info.json
        run: |
          cat <<EOF > build_info.json
          {
            "version": "${APP_VERSION}",
            "tag": "${APP_TAG}",
            "commit": "${APP_COMMIT}",
            "commit_short": "${APP_COMMIT_SHORT}",
            "commit_title": "${APP_COMMIT_TITLE}",
            "commit_body": "${APP_COMMIT_BODY}",
            "commit_time": "${APP_COMMIT_TIME}",
            "build_time_utc": "$(date -u)",
            "build_time_ist": "$(TZ=Asia/Kolkata date)"
          }
          EOF

      - name: 🔐 Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: 🐳 Build Image
        run: |
          docker build -t pythoncodelife/backend-auth-service:${APP_VERSION} .

      - name: 🚀 Push Image
        run: |
          docker push pythoncodelife/backend-auth-service:${APP_VERSION}
