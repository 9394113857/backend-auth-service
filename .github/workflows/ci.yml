name: 🚀 CI - Backend Auth Service

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Git Info
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag")

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "COMMIT_FULL=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_TITLE=$(git log -1 --pretty=%s)" >> $GITHUB_ENV

          echo "COMMIT_BODY<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=%b >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate build_info.json
        run: |
          cat <<EOF > build_info.json
          {
            "version": "${TAG}",
            "tag": "${TAG}",
            "commit": "${COMMIT_FULL}",
            "commit_short": "${COMMIT_SHORT}",
            "commit_title": "${COMMIT_TITLE}",
            "commit_body": "${COMMIT_BODY}",
            "build_time_utc": "$(date -u)",
            "build_time_ist": "$(TZ=Asia/Kolkata date)"
          }
          EOF

          cat build_info.json

      - name: Docker Build (NO CACHE)
        run: docker build --no-cache -t backend-auth-service:${TAG} .

      - name: Push (optional)
        run: echo "push step here"