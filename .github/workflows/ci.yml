name: Build, Push & Notify

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1️⃣ Checkout Code
    # =========================
    - name: Checkout code
      uses: actions/checkout@v3

    # =========================
    # 2️⃣ Set Version
    # =========================
    - name: Set version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=dev-${GITHUB_SHA}
        fi
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

    # =========================
    # 3️⃣ Docker Login
    # =========================
    - name: Login to DockerHub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    # =========================
    # 4️⃣ Build Image
    # =========================
    - name: Build Docker image
      run: |
        docker build -t pythoncodelife/backend-auth-service:${{ env.APP_VERSION }} .

    # =========================
    # 5️⃣ Tag latest (main only)
    # =========================
    - name: Tag latest
      if: startsWith(github.ref, 'refs/heads/main')
      run: |
        docker tag pythoncodelife/backend-auth-service:${{ env.APP_VERSION }} pythoncodelife/backend-auth-service:latest

    # =========================
    # 6️⃣ Push Image
    # =========================
    - name: Push Docker image
      run: |
        docker push pythoncodelife/backend-auth-service:${{ env.APP_VERSION }}

    # =========================
    # 7️⃣ Push latest
    # =========================
    - name: Push latest
      if: startsWith(github.ref, 'refs/heads/main')
      run: |
        docker push pythoncodelife/backend-auth-service:latest

    # =========================
    # 8️⃣ EMAIL ON SUCCESS ✅
    # =========================
    - name: Send Email Success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.MAIL_USERNAME_MAIN }}
        password: ${{ secrets.MAIL_PASSWORD_MAIN }}
        subject: "✅ CI SUCCESS - Auth Service"
        body: |
          Build & Push Successful 🚀

          Repo: backend-auth-service
          Version: ${{ env.APP_VERSION }}

          Docker Image:
          pythoncodelife/backend-auth-service:${{ env.APP_VERSION }}

        to: ${{ secrets.MAIL_USERNAME_MAIN }}
        from: ${{ secrets.MAIL_USERNAME_MAIN }}

    # =========================
    # 9️⃣ EMAIL ON FAILURE ❌
    # =========================
    - name: Send Email Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.MAIL_USERNAME_MAIN }}
        password: ${{ secrets.MAIL_PASSWORD_MAIN }}
        subject: "❌ CI FAILED - Auth Service"
        body: |
          Build FAILED ❌

          Repo: backend-auth-service
          Check GitHub Actions logs immediately.

        to: ${{ secrets.MAIL_USERNAME_MAIN }}
        from: ${{ secrets.MAIL_USERNAME_MAIN }}
