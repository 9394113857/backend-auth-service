# ==========================================================
# WORKFLOW NAME
# ==========================================================
name: 🚀 CI/CD – Auth Backend (Docker → Railway)

# ==========================================================
# TRIGGERS
# ==========================================================
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ==========================================================
# JOBS
# ==========================================================
jobs:
  ci-cd-auth-backend:
    runs-on: ubuntu-latest

    # ------------------------------------------------------
    # GLOBAL ENV (USED EVERYWHERE)
    # ------------------------------------------------------
    env:
      IMAGE_NAME: pythoncodelife/auth-backend
      IMAGE_TAG: latest

    steps:

      # =====================================================
      # CI STAGE – CHECKOUT
      # =====================================================
      - name: 🧾 Checkout source code
        uses: actions/checkout@v4

      - name: 🖨️ Log checkout
        run: echo "✅ Source code checked out"

      # =====================================================
      # CI STAGE – BUILD METADATA
      # =====================================================
      - name: ⏱️ Generate build timestamp
        run: |
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "✅ Build timestamp generated"

      # =====================================================
      # CI STAGE – DOCKER SETUP
      # =====================================================
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🖨️ Log Docker setup
        run: echo "✅ Docker Buildx ready"

      # =====================================================
      # CI STAGE – DOCKER LOGIN
      # =====================================================
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🖨️ Log Docker login
        run: echo "✅ Logged in to Docker Hub"

      # =====================================================
      # CI STAGE – BUILD & PUSH IMAGE
      # =====================================================
      - name: 🏗️ Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: 🖨️ Log image push
        run: |
          echo "✅ Docker image pushed"
          echo "Image: $IMAGE_NAME:$IMAGE_TAG"
          echo "Time: $BUILD_TIME"

      # =====================================================
      # CI STAGE – EMAIL (BUILD SUCCESS)
      # =====================================================
      - name: 📧 Email – Docker Build Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Docker Build Success | Auth Backend | ${{ env.BUILD_TIME }}"
          html_body: |
            <h2>✅ Docker Image Built & Pushed</h2>
            <table border="1" cellpadding="8">
              <tr><td><b>Repository</b></td><td>backend-auth-service</td></tr>
              <tr><td><b>Image</b></td><td>${{ env.IMAGE_NAME }}</td></tr>
              <tr><td><b>Tag</b></td><td>${{ env.IMAGE_TAG }}</td></tr>
              <tr><td><b>Branch</b></td><td>main</td></tr>
              <tr><td><b>Build Time</b></td><td>${{ env.BUILD_TIME }}</td></tr>
              <tr><td><b>Status</b></td><td style="color:green;"><b>SUCCESS</b></td></tr>
            </table>
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions

      # =====================================================
      # CD STAGE – DEPLOY TO RAILWAY (OFFICIAL API)
      # =====================================================
      - name: 🚀 Deploy to Railway
        run: |
          echo "🚀 Triggering Railway deployment..."

          curl -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "query": "mutation { serviceInstanceDeploy(serviceId: \"'${{ secrets.RAILWAY_SERVICE_ID }}'\") }"
            }'

          echo "✅ Railway deployment triggered"

      # =====================================================
      # CD STAGE – EMAIL (DEPLOY SUCCESS)
      # =====================================================
      - name: 📧 Email – Deployment Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Deployment Success | Railway | ${{ env.BUILD_TIME }}"
          html_body: |
            <h2>🚀 Auth Backend Deployed Successfully</h2>
            <table border="1" cellpadding="8">
              <tr><td><b>Platform</b></td><td>Railway</td></tr>
              <tr><td><b>Service</b></td><td>auth-backend</td></tr>
              <tr><td><b>Image</b></td><td>${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}</td></tr>
              <tr><td><b>Deploy Time</b></td><td>${{ env.BUILD_TIME }}</td></tr>
              <tr><td><b>Status</b></td><td style="color:green;"><b>LIVE</b></td></tr>
            </table>
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions

      # =====================================================
      # FAILURE HANDLER – ANY STAGE
      # =====================================================
      - name: ❌ Email – CI/CD Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI/CD Failed | Auth Backend | ${{ env.BUILD_TIME }}"
          html_body: |
            <h2 style="color:red;">❌ CI/CD Pipeline Failed</h2>
            <table border="1" cellpadding="8">
              <tr><td><b>Repository</b></td><td>backend-auth-service</td></tr>
              <tr><td><b>Branch</b></td><td>main</td></tr>
              <tr><td><b>Time</b></td><td>${{ env.BUILD_TIME }}</td></tr>
              <tr><td><b>Status</b></td><td style="color:red;"><b>FAILED</b></td></tr>
            </table>
            <p>Please check GitHub Actions logs.</p>
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions            
