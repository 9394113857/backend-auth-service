name: Docker CI - Auth Backend (Build, Push & Notify)

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"   # Daily at 02:00 UTC

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Setup Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 4: Build & Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: pythoncodelife/auth-backend:latest

      # STEP 5: Send SUCCESS mail
      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Docker CI Success - Auth Backend"
          body: |
            Docker image build & push completed successfully.

            Repository: backend-auth-service
            Image: pythoncodelife/auth-backend:latest
            Branch: main
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions

      # STEP 6: Send FAILURE mail
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Docker CI Failed - Auth Backend"
          body: |
            Docker CI pipeline FAILED.

            Please check GitHub Actions logs immediately.
            Repository: backend-auth-service
            Branch: main
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
