name: 🚀 Auth DB Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action: SAFE (no changes) or RESET (drop & recreate DB)"
        required: true
        default: "SAFE"

jobs:
  migrate:
    name: 🔧 Run DB Operation
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 📥 CHECKOUT
      # ==========================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 🐍 PYTHON SETUP
      # ==========================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 📦 INSTALL
      # ==========================================
      - name: 📦 Install Dependencies
        run: |
          echo "======================================="
          echo "📦 INSTALLING DEPENDENCIES..."
          echo "======================================="
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ DONE"
          echo "======================================="

      # ==========================================
      # ⚙️ FLASK CONFIG
      # ==========================================
      - name: ⚙️ Configure Flask
        run: |
          echo "FLASK_APP=app.py" >> $GITHUB_ENV
          echo "✅ FLASK APP SET"

      # ==========================================
      # 🛑 SAFETY GATE
      # ==========================================
      - name: 🛑 Safety Check
        run: |
          echo "======================================="
          echo "⚠️ SELECTED ACTION: ${{ github.event.inputs.action }}"
          echo "======================================="

          if [ "${{ github.event.inputs.action }}" != "RESET" ]; then
            echo "✅ SAFE MODE: No destructive changes will be made."
            echo "🚫 Skipping DB reset."
            exit 0
          fi

          echo "🔥 RESET MODE CONFIRMED"
          echo "======================================="

      # ==========================================
      # 💣 DROP ALL TABLES
      # ==========================================
      - name: 💣 Drop All Tables
        if: ${{ github.event.inputs.action == 'RESET' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "======================================="
          echo "💣 DROPPING ALL TABLES..."
          echo "⚠️ THIS WILL DELETE ALL DATA"
          echo "======================================="

          python - <<EOF
from sqlalchemy import create_engine, text
import os

engine = create_engine(os.environ["DATABASE_URL"])

with engine.connect() as conn:
    conn.execute(text("""
        DO $$ DECLARE
            r RECORD;
        BEGIN
            FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP TABLE IF EXISTS ' || quote_ident(r.tablename) || ' CASCADE';
            END LOOP;
        END $$;
    """))
    conn.commit()

print("✅ ALL TABLES DROPPED SUCCESSFULLY")
EOF

      # ==========================================
      # 🧹 CLEAN MIGRATIONS
      # ==========================================
      - name: 🧹 Remove Old Migrations
        if: ${{ github.event.inputs.action == 'RESET' }}
        run: |
          rm -rf migrations
          echo "✅ Old migrations removed"

      # ==========================================
      # 🆕 INIT MIGRATIONS
      # ==========================================
      - name: 🆕 Create Fresh Migration
        if: ${{ github.event.inputs.action == 'RESET' }}
        run: |
          flask db init
          flask db migrate -m "fresh start"

      # ==========================================
      # ⬆️ APPLY MIGRATIONS
      # ==========================================
      - name: ⬆️ Apply Migration
        if: ${{ github.event.inputs.action == 'RESET' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          flask db upgrade
          echo "======================================="
          echo "🎉 DATABASE RECREATED SUCCESSFULLY"
          echo "======================================="

      # ==========================================
      # ✅ DONE
      # ==========================================
      - name: ✅ Completed
        run: |
          echo "======================================="
          echo "🏁 WORKFLOW FINISHED"
          echo "======================================="
