name: 🚀 Auth DB Migration (FULL RESET - SAFE CONFIRM)

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: "⚠️ Type YES to DROP ALL TABLES and recreate DB (default: NO)"
        required: false
        default: "NO"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 📥 CHECKOUT
      # ==========================================
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 🐍 PYTHON SETUP
      # ==========================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 📦 INSTALL
      # ==========================================
      - name: 📦 Install dependencies
        run: |
          echo "======================================="
          echo "📦 INSTALLING DEPENDENCIES..."
          echo "======================================="

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # ⚙️ FLASK CONFIG
      # ==========================================
      - name: ⚙️ Set Flask App
        run: |
          echo "FLASK_APP=app.py" >> $GITHUB_ENV

      # ==========================================
      # 🛑 SAFETY CHECK
      # ==========================================
      - name: 🛑 Confirm before destructive action
        run: |
          echo "======================================="
          echo "⚠️ SAFETY CHECK"
          echo "You selected: ${{ github.event.inputs.confirm_reset }}"
          echo "======================================="

          if [ "${{ github.event.inputs.confirm_reset }}" != "YES" ]; then
            echo "❌ RESET NOT CONFIRMED"
            echo "🛑 Skipping destructive operations..."
            echo "======================================="
            exit 0
          fi

          echo "✅ CONFIRMED: Proceeding with FULL RESET"
          echo "======================================="

      # ==========================================
      # 💣 DROP ALL TABLES
      # ==========================================
      - name: 💣 Drop ALL tables
        if: ${{ github.event.inputs.confirm_reset == 'YES' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "======================================="
          echo "💣 DROPPING ALL TABLES..."
          echo "⚠️ DATA WILL BE LOST"
          echo "======================================="

          python - <<EOF
from sqlalchemy import create_engine, text
import os

engine = create_engine(os.environ["DATABASE_URL"])

with engine.connect() as conn:
    conn.execute(text("""
        DO $$ DECLARE
            r RECORD;
        BEGIN
            FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
                EXECUTE 'DROP TABLE IF EXISTS ' || quote_ident(r.tablename) || ' CASCADE';
            END LOOP;
        END $$;
    """))
    conn.commit()

print("✅ ALL TABLES DROPPED")
EOF

      # ==========================================
      # 🧹 CLEAN MIGRATIONS
      # ==========================================
      - name: 🧹 Clean migrations
        if: ${{ github.event.inputs.confirm_reset == 'YES' }}
        run: |
          rm -rf migrations
          echo "✅ OLD MIGRATIONS REMOVED"

      # ==========================================
      # 🆕 INIT MIGRATIONS
      # ==========================================
      - name: 🆕 Initialize migrations
        if: ${{ github.event.inputs.confirm_reset == 'YES' }}
        run: |
          flask db init
          flask db migrate -m "🔥 fresh start"

      # ==========================================
      # ⬆️ APPLY MIGRATIONS
      # ==========================================
      - name: ⬆️ Apply migrations
        if: ${{ github.event.inputs.confirm_reset == 'YES' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          flask db upgrade

          echo "======================================="
          echo "🎉 DATABASE RECREATED SUCCESSFULLY"
          echo "======================================="

      # ==========================================
      # ✅ DONE
      # ==========================================
      - name: ✅ Done
        run: |
          echo "======================================="
          echo "🏁 WORKFLOW FINISHED"
          echo "======================================="
